<!doctype html>
<html>
  <head>
    <title>Apply | Acme Hiring</title>
  </head>
  <body>
    <h1>Product Engineer application</h1>
    <form>
      <label for="name">Full name *</label>
      <input id="name" name="name" type="text" required />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" />

      <label for="why">Why do you want to join us?</label>
      <textarea id="why" name="why"></textarea>

      <label for="notice">Notice period</label>
      <select id="notice" name="notice">
        <option value="">Choose</option>
        <option value="imm">Immediately</option>
        <option value="30">30 days</option>
        <option value="60">60 days</option>
      </select>

      <fieldset>
        <legend>Work authorisation *</legend>
        <label><input type="radio" name="auth" value="yes" /> Yes, I can work in India</label>
        <label><input type="radio" name="auth" value="no" /> No</label>
      </fieldset>

      <fieldset>
        <legend>Which areas interest you?</legend>
        <label><input type="checkbox" name="area" value="web" /> Web</label>
        <label><input type="checkbox" name="area" value="mobile" /> Mobile</label>
        <label><input type="checkbox" name="area" value="data" /> Data</label>
      </fieldset>

      <input type="search" name="q" placeholder="Search the site" />
      <input type="password" name="pw" />
      <button type="submit" id="submit">Submit</button>
    </form>
  </body>
</html>
